baseURL: https://streamingsecurity.live/
languageCode: en-us
title: Streaming Security
enableRobotsTXT: true
disableKinds: [section, rss]

# Show notes live in content/episodes/<number>.md and publish at /ep/<number>/.
permalinks:
  page:
    episodes: /ep/:contentbasename/
  term:
    controls: /controls/:slug/

# The CIS Controls each episode maps its stories to. Names come from data/cis_controls.yaml.
taxonomies:
  control: controls
timeZone: America/Detroit

params:
  description: A live cybersecurity show, every Tuesday (except when we can't). Tom Lawrence and Matt Lee break down the week's exploits, breaches, and advisories, and which control would have caught them.
  youtube: https://www.youtube.com/@StreamingSecurity

markup:
  goldmark:
    renderer:
      unsafe: false
